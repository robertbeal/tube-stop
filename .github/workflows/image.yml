name: image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A pushed tag builds that release. The nightly and manual runs rebuild the newest release with the
      # newest yt-dlp, or build `edge` if there is no release yet. A push to main builds `edge`.
      - name: Work out what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ytdlp=$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name)
          newest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$tag is not a version like v1.2.3" >&2; exit 1; }
          elif [ "$GITHUB_EVENT_NAME" != push ] && [ -n "$newest" ]; then
            tag="$newest"
          else
            tag=""
          fi

          skip=false
          if [ -z "$tag" ]; then
            tags="$IMAGE:edge"
            ref="$GITHUB_SHA"
          else
            version="${tag#v}"
            major="${version%%.*}"
            minor="${version%.*}"
            ref="$tag"
            tags="$IMAGE:${version}_${ytdlp}"$'\n'"$IMAGE:$version"
            # Only the newest release moves the floating tags.
            if [ "$tag" = "$newest" ]; then
              tags+=$'\n'"$IMAGE:$minor"$'\n'"$IMAGE:latest"
              [ "$major" != 0 ] && tags+=$'\n'"$IMAGE:$major"
            fi
            if [ "$GITHUB_EVENT_NAME" = schedule ] && docker manifest inspect "$IMAGE:${version}_${ytdlp}" >/dev/null 2>&1; then
              skip=true
            fi
          fi

          {
            echo "ytdlp=$ytdlp"
            echo "ref=$ref"
            echo "skip=$skip"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the code to build
        if: steps.plan.outputs.skip != 'true'
        run: git checkout --detach "${{ steps.plan.outputs.ref }}"

      - uses: docker/setup-qemu-action@v3
        if: steps.plan.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.plan.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: YTDLP_VERSION=${{ steps.plan.outputs.ytdlp }}
          tags: ${{ steps.plan.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.plan.outputs.ref }}
            yt-dlp.version=${{ steps.plan.outputs.ytdlp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  # Binaries for a release: the app compiled into one executable, with Bun inside. They do not include
  # yt-dlp or ffmpeg, so those must be installed separately.
  binaries:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # keep in step with BUN_VERSION in the Dockerfile

      - run: bun install --frozen-lockfile --production

      - name: Compile
        run: |
          mkdir dist
          for target in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl; do
            bun build --compile --minify --target="bun-$target" src/main.ts --outfile "dist/tube-stop-$target"
          done

      # The binary has to serve its pages and embedded files from an empty folder.
      - name: Smoke test
        run: |
          cd "$(mktemp -d)"
          export DATA_DIR=./data MEDIA_DIR=./media CACHE_DIR=./cache HOST=127.0.0.1 PORT=18080 YTDLP_BIN=true
          "$GITHUB_WORKSPACE/dist/tube-stop-linux-x64" > log 2>&1 &
          for _ in $(seq 20); do curl -sf -o /dev/null http://127.0.0.1:18080/ && break; sleep 0.5; done
          for path in / /admin/setup /static/bootstrap.min.css /static/bootstrap-LICENSE.txt /static/style.css /static/theme.js /player.js; do
            curl -sf -o /dev/null "http://127.0.0.1:18080$path" || { echo "$path failed"; cat log; exit 1; }
          done
          kill %1

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for target in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl; do
            mkdir "tube-stop-$GITHUB_REF_NAME-$target"
            install -m 755 "tube-stop-$target" "tube-stop-$GITHUB_REF_NAME-$target/tube-stop"
            cp ../LICENSE "tube-stop-$GITHUB_REF_NAME-$target/"
            tar -czf "tube-stop-$GITHUB_REF_NAME-$target.tar.gz" "tube-stop-$GITHUB_REF_NAME-$target"
          done
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS
