name: image

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the newest yt-dlp
        id: ytdlp
        run: echo "version=$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The nightly run only builds when there is a yt-dlp this image has not had yet.
      - name: Check for an existing image
        id: existing
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && docker manifest inspect "$IMAGE:yt-dlp-${{ steps.ytdlp.outputs.version }}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.existing.outputs.built != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.built != 'true'

      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.built != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:yt-dlp-${{ steps.ytdlp.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            yt-dlp.version=${{ steps.ytdlp.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
