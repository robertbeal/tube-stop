name: release

# Everything is built from main. A feat or fix pushed to main is released, and semantic-release works out the
# version from the commit messages (see .releaserc.json). Other commits only run the checks.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency: release

env:
  BUN_VERSION: 1.4.4

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.next.outputs.new_release_published }}
      version: ${{ steps.next.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Next version
        id: next
        uses: cycjimmy/semantic-release-action@v8
        with:
          dry_run: true
          semantic_version: 25
          extra_plugins: conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --production

      # The app compiled into one executable, with Bun inside. The release attaches these, and the image runs the
      # musl ones.
      - name: Compile
        run: |
          for arch in amd64 arm64; do
            for libc in "" -musl; do
              bun build --compile --minify --target="bun-linux-${arch/amd64/x64}$libc" src/main.ts --outfile "dist/tube-stop-linux-$arch$libc"
            done
          done

      - name: Package
        working-directory: dist
        run: |
          for binary in tube-stop-linux-*; do
            mkdir "$binary.d"
            install -m 755 "$binary" "$binary.d/tube-stop"
            cp ../LICENSE "$binary.d/"
            tar -czf "$binary.tar.gz" -C "$binary.d" .
          done
          sha256sum ./*.tar.gz > SHA256SUMS

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: tags
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }},enable=${{ !startsWith(needs.version.outputs.version, '0.') }}

      # The image is started before anything is pushed, so one that cannot run never gets a tag.
      - name: Build the image to test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tube-stop:test
          cache-from: type=gha

      - name: Test the image
        run: scripts/test-image.sh tube-stop:test

      - name: Push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the release
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 25
          extra_plugins: conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ github.token }}
