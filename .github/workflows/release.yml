name: release

# Everything is built from main. A feat or fix pushed to main is released: the version comes from the commit
# messages (see scripts/next-version.sh). The nightly run rebuilds the current release when yt-dlp has a new one.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  packages: write

concurrency: release

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: yt-dlp Version
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export YTDLP=$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name)
          { echo "ytdlp=$YTDLP"; scripts/next-version.sh; } | tee -a "$GITHUB_OUTPUT"

      # The app compiled into one executable, with Bun inside. The release attaches these, and the image runs them.
      - name: Compile
        if: steps.plan.outputs.build == 'true'
        run: |
          for arch in amd64 arm64; do
            for libc in "" -musl; do
              bun build --compile --minify --target="bun-linux-${arch/amd64/x64}$libc" src/main.ts --outfile "dist/tube-stop-linux-$arch$libc"
            done
          done

      - name: Smoke Test
        if: steps.plan.outputs.build == 'true'
        run: scripts/test-binary.sh dist/tube-stop-linux-amd64

      - uses: docker/setup-qemu-action@v3
        if: steps.plan.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.build == 'true'

      # The image is started before anything is pushed, so one that cannot run never gets a tag.
      - name: Build the image to test
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: YTDLP_VERSION=${{ steps.plan.outputs.ytdlp }}
          tags: tube-stop:test
          cache-from: type=gha

      - name: Test the image
        if: steps.plan.outputs.build == 'true'
        run: scripts/test-image.sh tube-stop:test

      - name: Push the image
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: YTDLP_VERSION=${{ steps.plan.outputs.ytdlp }}
          tags: ${{ steps.plan.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            yt-dlp.version=${{ steps.plan.outputs.ytdlp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only for a new version, and only once everything above has passed.
      - name: Create the release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          cd dist
          for target in linux-amd64 linux-arm64 linux-amd64-musl linux-arm64-musl; do
            name="tube-stop-v$VERSION-$target"
            mkdir "$name"
            install -m 755 "tube-stop-$target" "$name/tube-stop"
            cp ../LICENSE "$name/"
            tar -czf "$name.tar.gz" "$name"
          done
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release create "v$VERSION" ./*.tar.gz SHA256SUMS --target "$GITHUB_SHA" --generate-notes
