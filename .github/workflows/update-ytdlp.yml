name: update yt-dlp

# YouTube changes often, so yt-dlp needs to be kept current. A new yt-dlp is committed to main as a fix, which
# releases a new version of the image.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update the version in the Dockerfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name)
          sed -i "s/^ARG YTDLP_VERSION=.*/ARG YTDLP_VERSION=$latest/" Dockerfile
          git diff --quiet Dockerfile && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fix(deps): update yt-dlp to $latest"
          git push
          # A push made with the workflow's own token does not start other workflows, so start the release.
          gh workflow run release.yml
